name: Build and Publish Metalprobe Image
on:
  release:
    types:
    - published
  push:
    branches:
    - main
    tags:
    - v*
    paths:
    - 'metalprobe-image/**'
    - 'Makefile'
    - '.github/workflows/publish-metalprobe-image.yml'
  pull_request:
    paths:
    - 'metalprobe-image/**'
    - 'Makefile'
    - '.github/workflows/publish-metalprobe-image.yml'
    types: [opened, synchronize, reopened]

jobs:
  publish:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'release' && github.event.action == 'published')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      METALPROBE_IMAGE_NAME: ghcr.io/${{ github.repository }}/metalprobe
      METALPROBE_IMAGE_TAG: ${{ github.sha }}

    steps:
    - name: Clone the code
      uses: actions/checkout@v7

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: metalprobe-image/go.mod

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache libelf-dev

    - name: Build metalprobe image
      run: make metalprobe-image-build

    - name: Push metalprobe image
      run: make metalprobe-image-push

    - name: Tag and push main image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        ironcore-image tag "${METALPROBE_IMAGE_NAME}:${METALPROBE_IMAGE_TAG}" "${METALPROBE_IMAGE_NAME}:main"
        ironcore-image push "${METALPROBE_IMAGE_NAME}:main"

    - name: Tag and push PR image
      if: github.event_name == 'pull_request'
      env:
        PR_TAG: pr-${{ github.event.pull_request.number }}
      run: |
        ironcore-image tag "${METALPROBE_IMAGE_NAME}:${METALPROBE_IMAGE_TAG}" "${METALPROBE_IMAGE_NAME}:${PR_TAG}"
        ironcore-image push "${METALPROBE_IMAGE_NAME}:${PR_TAG}"
