apiVersion: apps/v1
kind: Deployment
metadata:
  name: firmware-repo
  labels:
    app: firmware-repo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firmware-repo
  template:
    metadata:
      labels:
        app: firmware-repo
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /bios-1.0.0.json
            port: http
        volumeMounts:
        - name: packages
          mountPath: /usr/share/nginx/html
          readOnly: true
      volumes:
      - name: packages
        configMap:
          name: firmware-packages
