# Firmware packages for the qemu-bmc UpdateService tests
server {
  listen 80;
  root /usr/share/nginx/html;
}

# TLS in front of metal-maintenance-operator's Redfish event receiver, which
# only serves plain HTTP; iDRAC only accepts https event destinations.
server {
  listen 8443 ssl;
  ssl_certificate     /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  # MetricReport payloads
  client_max_body_size 16m;

  # Resolve the receiver per request, so nginx (and the firmware server) also
  # starts when metal-maintenance-operator is not deployed.
  resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
  set $receiver http://metal-maintenance-operator-controller-manager-telemetry-events.metal-maintenance-operator-system.svc.cluster.local:9092;

  location / {
    proxy_pass $receiver;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
