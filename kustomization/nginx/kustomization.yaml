apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nginx-system

resources:
- namespace.yaml
- certificate.yaml
- deployment.yaml
- service.yaml

configMapGenerator:
- name: nginx-conf
  files:
  - default.conf=nginx.conf
- name: firmware-packages
  files:
  - packages/bios-1.0.0.json
  - packages/bios-1.1.0.json
  - packages/bmc-1.0.0.json
  - packages/bmc-1.1.0.json
