apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nginx-tls
spec:
  secretName: nginx-tls
  commonName: 172.16.100.2
  ipAddresses:
  - 172.16.100.2
  dnsNames:
  - nginx.nginx-system.svc
  - nginx.nginx-system.svc.cluster.local
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: selfsigned
    kind: Issuer
