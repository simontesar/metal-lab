apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        - name: https
          containerPort: 8443
        readinessProbe:
          httpGet:
            path: /bios-1.0.0.json
            port: http
        volumeMounts:
        - name: packages
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: conf
          mountPath: /etc/nginx/conf.d
          readOnly: true
        - name: tls
          mountPath: /etc/nginx/tls
          readOnly: true
      volumes:
      - name: packages
        configMap:
          name: firmware-packages
      - name: conf
        configMap:
          name: nginx-conf
      - name: tls
        secret:
          secretName: nginx-tls
