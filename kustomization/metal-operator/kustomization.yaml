apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- https://github.com/ironcore-dev/metal-operator//config/default?ref=96af5447400d18a5f0f9ea0dbb88e177f7916826 # v0.8.0
- registry_service.yaml
- macdb-secret.yaml

configMapGenerator:
- name: ignition-template
  namespace: metal-operator-system
  files:
  - ignition-template.yaml

generatorOptions:
  disableNameSuffixHash: true

patches:
- path: manager_patch.yaml
- path: metaldata_patch.yaml

images:
- name: controller
  newName: ghcr.io/ironcore-dev/metal-operator-controller-manager
  newTag: v0.8.0
- name: metaldata
  newName: ghcr.io/ironcore-dev/metaldata
  newTag: v0.8.0
