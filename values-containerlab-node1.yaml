bmcIP: "172.16.100.11"
bmcPort: 443
bmcScheme: https
username: admin
password: password
firmwareVersion: "1.0.0"
biosVersion: "1.0.0"
01-bmc-registration:
  model: "Standard PC (Q35 + ICH9, 2009)"
  powerState: "On"
06-biossettings-noreboot:
  key: "AdminPhone"
  value: "+1-555-0100"
  baselineValue: "+1-555-0199"
07-biossettings-reboot:
  key: "BootMode"
  value: "Bios"
  baselineValue: "Uefi"
08-bmcsettings:
  key: "EmailAlert.1.Address"
  value: "alerts@example.com"
  baselineValue: "compat-base@example.com"
12-force-power-off:
  osBootWait: 30s
  powerPollingTimeout: 15
13-event-subscriptions:
  testMessageId: "TestEventId"
  testSeverity: "OK"
  testOriginOfCondition: "/redfish/v1/Managers/1"
14-biosversion-upgrade:
  transferProtocol: HTTP
  baselineImageURI: "http://172.16.100.2:30084/bios-1.0.0.json" # installs biosVersion
  version: "1.1.0"
  imageURI: "http://172.16.100.2:30084/bios-1.1.0.json"
15-bmcversion-upgrade:
  transferProtocol: HTTP
  baselineImageURI: "http://172.16.100.2:30084/bmc-1.0.0.json" # installs firmwareVersion
  version: "1.1.0"
  imageURI: "http://172.16.100.2:30084/bmc-1.1.0.json"
